name: strongR-frida

on:
  workflow_dispatch:

env:
  FRIDA_VERSION: "17.16.4"

jobs:
  android_build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: "temurin"
        java-version: "17"

    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1.0.6
      with:
        ndk-version: r25b

    - name: Set up Python 3.9
      uses: actions/setup-python@v5.1.0
      with:
        python-version: '3.9'

    - name: install dependencies
      run: |
        sudo apt-get update && DEBIAN_FRONTEND=noninteractive sudo apt-get install build-essential tree ninja-build gcc-multilib g++-multilib lib32stdc++-9-dev flex bison ruby ruby-dev python3-requests python3-setuptools python3-dev python3-pip libc6-dev libc6-dev-i386 -y
        sudo gem install fpm -v 1.11.0 --no-document
        python3 -m pip install lief graphlib

    - name: build frida for Android
      shell: bash
      run: |
        git config --global user.name "builder"
        git config --global user.email "builder@example.com"
        git clone https://github.com/hluwa/Patchs.git
        export ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
        git clone --recurse-submodules --branch "${FRIDA_VERSION}" https://github.com/frida/frida
        cd frida
        for path in ../Patchs/strongR-frida/*
        do
          name=$(basename $path)
          real=$(realpath $path)
          echo "=== Apply patches in $real to frida/subprojects/$name ==="
          cd subprojects/$name
          for p in ../../../Patchs/strongR-frida/$name/*.patch; do
            echo "--- Applying $(basename $p) (3-way) ---"
            if git am -3 "$p"; then
              echo "OK: $(basename $p) applied"
            else
              echo "CONFLICT: $(basename $p) could not be merged -- skipping this one patch"
              git am --abort || true
            fi
          done
          echo "Patch log for $name:"
          git log --oneline -10
          cd ../..
        done
        cd ..

        ARCHES="android-arm android-arm64 android-x86 android-x86_64"
        for ARCH in $ARCHES
        do
          mkdir build-$ARCH
          cd build-$ARCH
          ../frida/configure --host=$ARCH
          make
          cd ..
        done

    - name: package build result for Android
      shell: bash
      run: |
        mkdir -p out

        for ARCH in android-arm android-arm64 android-x86 android-x86_64; do
          gzip -c build-$ARCH/subprojects/frida-core/server/frida-server \
            > out/hluda-server-${FRIDA_VERSION}-${ARCH}.gz
          gzip -c build-$ARCH/subprojects/frida-core/inject/frida-inject \
            > out/hluda-inject-${FRIDA_VERSION}-${ARCH}.gz
          gzip -c build-$ARCH/subprojects/frida-core/lib/gadget/frida-gadget.so \
            > out/hluda-gadget-${FRIDA_VERSION}-${ARCH}.so.gz
        done

        ls -la out/

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: strongR-frida-${{ env.FRIDA_VERSION }}-android
        path: out/
        retention-days: 14
